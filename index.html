<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toluwalope Kolawole — Consulting for Media, Creative & Tech Brands</title>
  <meta name="description" content="Consulting for media, creative, and tech brands ready to level up their reputation, reach, and revenue." />

  <style>
    :root {
      --primary: #1a4cff; /* royal blue */
      --primary-hover: #000000; 
      --bg: #000; 
      --text: #ffffff;
      --muted: #cccccc;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 2rem;
      color: var(--text);
    }

    /* BUBBLES */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(26, 76, 255, 0.15);
      animation: float 9s linear infinite;
      bottom: -80px;
      opacity: 0.5;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(0.4); opacity: 0.6; }
      40% { opacity: 1; }
      100% { transform: translateY(-120vh) scale(1); opacity: 0; }
    }

    /* GLASS CARD */
    .card {
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 680px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 700;
      margin-bottom: 1.2rem; /* More spacing for hierarchy */
    }

    .tagline {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: var(--muted);
      margin-bottom: 2.8rem;
      line-height: 1.5;
    }

    /* BUTTONS */
    .btn {
      display: block;
      padding: 0.7rem 1.6rem;
      border-radius: 50px;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      border: 2px solid var(--primary);
      transition: 0.3s;
      margin: 0 auto;
      max-width: 240px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    /* BUTTON SPACING - MOBILE */
    @media (max-width: 500px) {
      .btn {
        font-size: 0.82rem;
        padding: 0.65rem 1.4rem;
      }

      .btn + .btn {
        margin-top: 1.1rem; /* B2 large breathing space */
      }

      h1 { margin-bottom: 1.4rem; }
      .tagline { margin-bottom: 2.4rem; }
    }

    /* DESKTOP SPACING (clean but tighter) */
    @media (min-width: 501px) {
      .btn {
        display: inline-block;
        margin: 0.4rem 0.6rem;
      }
    }

    /* SPOTIFY SECTION */
    #spotify {
      margin-top: 2.4rem;
    }
    #spotify img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 10px;
    }
    #spotify a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    #spotify a:hover { text-decoration: underline; }

  </style>
</head>

<body>

<script>
  for (let i = 0; i < 32; i++) {

</div>

<script>
  const refresh_token = "BQCE_2MUF0icBr05VMkXPDc4tea-nyQzBBm62cGQNmIhWHKGq2_BCkzsP3dD1GaB0zWJZy8rNZgCCc4VwpNUddqkcXXyCmPK_QxiTl1ruhZPvSP_VW2gs1V2E1cyQxpvARIZyxw-eG7cexc8NHPc96F_5VGQwi2s5gPVRTDsbQzmc3VyJECizDfPQU-dulj2ln37bvWVwCL9GtRCTlkcN7f1JYKNYSi-uU7fGyqS9NWxIbldQ40uuQC8pyMDulAz";

  async function getRecentlyPlayed() {
    try {
      const tokenResponse = await fetch(`https://spotify-refresh-token-generator.vercel.app/api/refresh_token?refresh_token=${refresh_token}`);
      const tokenData = await tokenResponse.json();
      const access_token = tokenData.access_token;

      const response = await fetch("https://api.spotify.com/v1/me/player/recently-played?limit=1", {
        headers: { Authorization: "Bearer " + access_token },
      });

      const data = await response.json();

      if (data.items && data.items.length > 0) {
        const track = data.items[0].track;

        document.getElementById("spotify").innerHTML = `
          <div>
            <img src="${track.album.images[0].url}" alt="Album Art" />
            <div><strong>${track.name}</strong></div>
            <div><em>${track.artists.map(a => a.name).join(", ")}</em></div>
            <div><a href="${track.external_urls.spotify}" target="_blank">Open in Spotify</a></div>
          </div>
        `;
      } else {
        document.getElementById("spotify").innerText = "No recent songs found.";
      }
    } catch (err) {
      document.getElementById("spotify").innerText = "Error loading Spotify data.";
    }
  }

  getRecentlyPlayed();
</script>
