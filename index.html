<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toluwalope Kolawole — Consulting for Media, Creative & Tech Brands</title>
  <meta name="description" content="Consulting for media, creative, and tech brands ready to level up their reputation, reach, and revenue." />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #1e40ff;
      --primary-hover: #000dff;
      --bg: #000000;
      --text: #ffffff;
      --muted: #a8adb5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 1rem;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 64, 255, 0.5), rgba(30, 64, 255, 0));
      animation: float 10s linear infinite;
      opacity: 0.75;
      bottom: -60px;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(0.5); opacity: 0.75; }
      50% { opacity: 0.95; }
      100% { transform: translateY(-120vh) scale(1); opacity: 0; }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      background: rgba(30, 64, 255, 0.08);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      border-radius: 20px;
      padding: 2.8rem 2rem;
      text-align: center;
      border: 1px solid rgba(30, 64, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-family: "Inter", sans-serif;
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .tagline {
      font-family: "Inter", sans-serif;
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      color: var(--muted);
      margin-bottom: 3rem;
      line-height: 1.7;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .btn {
      font-family: "Space Grotesk", sans-serif;
      display: inline-block;
      padding: 0.9rem 2.2rem;
      border-radius: 12px;
      background-color: var(--primary);
      color: #000;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid var(--primary);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 0.95rem;
      margin: 0.6rem;
      min-width: 120px;
      letter-spacing: 0.3px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(30, 64, 255, 0.35);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    #spotify {
      margin-top: 2.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #spotify a {
      font-family: "Inter", sans-serif;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.3s ease;
      display: inline-block;
    }

    #spotify a:hover {
      color: var(--primary);
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.3rem;
        background: rgba(30, 64, 255, 0.08);
        backdrop-filter: blur(14px) saturate(130%);
        -webkit-backdrop-filter: blur(14px) saturate(130%);
        border-radius: 18px;
      }

      h1 {
        margin-bottom: 0.8rem;
      }

      .tagline {
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .btn {
        padding: 0.6rem 1.2rem;
        font-size: 0.75rem;
        width: 85%;
        margin: 0.5rem auto;
        display: block;
      }

      #spotify {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
      }

      #spotify a {
        font-size: 0.85rem;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 2rem 1.2rem;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.8rem;
      }

      .tagline {
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      .btn {
        padding: 0.65rem 1.2rem;
        font-size: 0.75rem;
        margin: 0.5rem auto;
      }
    }
  </style>
</head>

<body>

<script>
  for (let i = 0; i < 40; i++) {
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    bubble.style.width = bubble.style.height = (Math.random() * 40 + 20) + 'px';
    bubble.style.left = Math.random() * 100 + 'vw';
    bubble.style.animationDuration = (Math.random() * 8 + 6) + 's';
    bubble.style.animationDelay = (Math.random() * 5) + 's';
    document.body.appendChild(bubble);
  }
</script>

<div class="card">
  <h1>Toluwalope Kolawole</h1>
  <p class="tagline">Consulting for media, creative, and tech brands ready to level up their reputation, reach, and revenue.</p>

  <a class="btn" href="resume.pdf" target="_blank">📄 resume</a>
  <a class="btn" href="https://claude.ai/public/artifacts/0ef53599-9b11-4922-bf12-d2afcb8a296a" target="_blank">🌐 services</a>
  <a class="btn" href="https://linktr.ee/toluwalopekolawole" target="_blank">💬 chat</a>

  <div id="spotify">
    <a href="https://www.linkedin.com/in/toluwalope1/" target="_blank">🌿 let's connect on LinkedIn</a>
  </div>
</div>

</body>
</html>
