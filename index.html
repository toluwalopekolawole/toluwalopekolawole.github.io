<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Toluwalope Kolawole — Consulting for Media, Creative & Tech Brands</title>
  <meta name="description" content="Consulting for media, creative, and tech brands ready to level up their reputation, reach, and revenue." />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --primary: #1e40ff; /* royal blue */
      --primary-hover: #000dff;
      --bg: #000000; /* black background */
      --text: #ffffff;
      --muted: #a8adb5;
      --accent: #e0e0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
      padding: 1rem;
    }

    /* ----------------------------------------------- */
    /*                      BUBBLES                    */
    /* ----------------------------------------------- */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 64, 255, 0.5), rgba(30, 64, 255, 0));
      animation: float 10s linear infinite;
      opacity: 0.75;
      bottom: -60px;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(0.5); opacity: 0.75; }
      50% { opacity: 0.95; }
      100% { transform: translateY(-120vh) scale(1); opacity: 0; }
    }

    /* ----------------------------------------------- */
    /*                 GLASS CARD (ENHANCED)          */
    /* ----------------------------------------------- */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;

      background: rgba(30, 64, 255, 0.08);
      backdrop-filter: blur(16px) saturate(140%);
      -webkit-backdrop-filter: blur(16px) saturate(140%);

      border-radius: 20px;
      padding: 2.8rem 2rem;
      text-align: center;

      border: 1px solid rgba(30, 64, 255, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      transition: all 0.4s ease;
    }

    h1 {
      font-family: "Inter", sans-serif;
      font-size: clamp(2.2rem, 6vw, 3rem);
      font-weight: 700;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .tagline {
      font-family: "Inter", sans-serif;
      font-size: clamp(1.05rem, 3.2vw, 1.25rem);
      color: var(--muted);
      margin-bottom: 3rem;
      line-height: 1.7;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* ----------------------------------------------- */
    /*                   BUTTONS                       */
    /* ----------------------------------------------- */
    .btn {
      font-family: "Space Grotesk", sans-serif;
      display: inline-block;
      padding: 0.9rem 2.2rem;
      border-radius: 12px;
      background-color: var(--primary);
      color: #000;
      font-weight: 700;
      text-decoration: none;
      border: 2px solid var(--primary);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      font-size: 0.95rem;
      margin: 0.6rem;
      min-width: 120px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(30, 64, 255, 0.35);
    }

    .btn:active {
      transform: translateY(-1px);
    }

    /* Spotify */
    #spotify {
      margin-top: 2.5rem;
      padding-top: 2.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #spotify p {
      font-family: "Inter", sans-serif;
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    #spotify img {
      border-radius: 16px;
      width: 120px;
      height: 120px;
      object-fit: cover;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(30, 64, 255, 0.25), 0 0 1px rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    #spotify img:hover {
      transform: scale(1.05) translateZ(0);
      box-shadow: 0 12px 32px rgba(30, 64, 255, 0.4);
    }

    #spotify div {
      font-family: "Inter", sans-serif;
    }

    #spotify strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    #spotify em {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.8rem;
      font-style: normal;
    }

    #spotify a {
      font-family: "Space Grotesk", sans-serif;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    #spotify a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* ----------------------------------------------- */
    /*                MOBILE FIXES                     */
    /* ----------------------------------------------- */
    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.3rem;
        background: rgba(30, 64, 255, 0.08);
        backdrop-filter: blur(14px) saturate(130%);
        -webkit-backdrop-filter: blur(14px) saturate(130%);
        border-radius: 18px;
      }

      h1 {
        margin-bottom: 0.8rem;
      }

      .tagline {
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      .btn {
        padding: 0.6rem 1.2rem;
        font-size: 0.75rem;
        width: 85%;
        margin: 0.5rem auto;
        display: block;
      }

      #spotify {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
      }

      #spotify img {
        width: 90px;
        height: 90px;
        margin-bottom: 10px;
      }

      #spotify strong {
        font-size: 0.95rem;
      }

      #spotify em {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 2rem 1.2rem;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 0.8rem;
      }

      .tagline {
        font-size: 0.95rem;
        margin-bottom: 2rem;
      }

      .btn {
        padding: 0.65rem 1.2rem;
        font-size: 0.75rem;
        margin: 0.5rem auto;
      }
    }
  </style>
</head>

<body>

<!-- BUBBLES -->
<script>
  for (let i = 0; i < 40; i++) {
    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    bubble.style.width = bubble.style.height = (Math.random() * 40 + 20) + 'px';
    bubble.style.left = Math.random() * 100 + 'vw';
    bubble.style.animationDuration = (Math.random() * 8 + 6) + 's';
    bubble.style.animationDelay = (Math.random() * 5) + 's';
    document.body.appendChild(bubble);
  }
</script>

<div class="card">
  <h1>Toluwalope Kolawole</h1>
  <p class="tagline">Consulting for media, creative, and tech brands ready to level up their reputation, reach, and revenue.</p>

  <a class="btn" href="resume.pdf" target="_blank">📄 Resume</a>
  <a class="btn" href="mailto:tolu7711@gmail.com">✉️ Email</a>
  <a class="btn" href="https://linktr.ee/toluwalopekolawole" target="_blank">🌐 More</a>

  <div id="spotify">
    <p>🎧 Loading your recently played track...</p>
  </div>
</div>


<script>
  const refresh_token = "YOUR_REFRESH_TOKEN_HERE";

  async function getRecentlyPlayed() {
    try {
      const tokenResponse = await fetch(`https://spotify-refresh-token-generator.vercel.app/api/refresh_token?refresh_token=${refresh_token}`);
      const tokenData = await tokenResponse.json();
      const access_token = tokenData.access_token;

      const response = await fetch("https://api.spotify.com/v1/me/player/recently-played?limit=1", {
        headers: { Authorization: "Bearer " + access_token },
      });

      const data = await response.json();

      if (data.items && data.items.length > 0) {
        const track = data.items[0].track;
        document.getElementById("spotify").innerHTML = `
          <div>
            <img src="${track.album.images[0].url}" alt="Album Art" />
            <div><strong>${track.name}</strong></div>
            <div><em>${track.artists.map(a => a.name).join(", ")}</em></div>
            <div><a href="${track.external_urls.spotify}" target="_blank">Open in Spotify</a></div>
          </div>
        `;
      } else {
        document.getElementById("spotify").innerText = "No recent songs found.";
      }
    } catch (err) {
      document.getElementById("spotify").innerText = "Error loading Spotify data.";
    }
  }

  getRecentlyPlayed();
</script>

</body>
</html>
